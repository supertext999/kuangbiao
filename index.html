    [[3,2,2,2,2,1],[0,4,0,1,0,4],[1,1,4,3,3,0],[2,3,2,3,1,1]],
    [[4,1,0,2,0,2],[1,1,4,3,3,0],[2,3,2,3,1,1],[3,2,2,2,2,1]],
    [[2,3,3,2,1,0],[4,1,0,2,0,2],[1,1,4,3,3,0],[3,1,2,3,2,1]],
    [[4,1,0,2,0,2],[2,3,2,3,1,1],[1,1,4,3,3,0],[3,2,2,2,2,1]],
    [[2,3,3,2,1,0],[0,4,0,1,0,4],[3,2,2,2,2,1],[1,1,4,3,3,0]],
    [[4,1,0,2,0,2],[0,4,0,1,0,4],[1,1,4,3,3,0],[2,3,2,3,1,1]],
    [[4,1,0,2,0,2],[1,1,4,3,3,0],[2,3,2,3,1,1],[3,1,2,3,2,1]],
    [[2,3,3,2,1,0],[1,1,4,3,3,0],[4,1,0,2,0,2],[3,2,2,2,2,1]],
    [[4,1,0,2,0,2],[0,4,0,1,0,4],[1,1,4,3,3,0],[2,3,2,3,1,1]],
    [[2,3,3,2,1,0],[0,4,0,1,0,4],[1,1,4,3,3,0],[3,1,2,3,2,1]],
    [[1,1,4,3,3,0],[4,1,0,2,0,2],[2,3,2,3,1,1],[3,2,2,2,2,1]],
    [[4,1,0,2,0,2],[0,4,0,1,0,4],[1,1,4,3,3,0],[2,3,2,3,1,1]]
];

let currentQ = 0;
let score = [0,0,0,0,0,0];
let answerRecord = [];
const totalQ = questionList.length;

function startQuiz(){
    document.getElementById("startPage").style.display="none";
    document.getElementById("quizPage").style.display="block";
    renderQuestion();
}

function renderQuestion(){
    const q = questionList[currentQ];
    document.getElementById("qIndex").innerText = `题目 ${currentQ+1}/${totalQ}`;
    document.getElementById("questionText").innerText = q.q;
    document.getElementById("optionBox").innerHTML = "";
    document.getElementById("progressBar").style.width = ((currentQ)/totalQ*100)+"%";
    const prevBtn = document.getElementById("prevBtn");
    prevBtn.disabled = currentQ === 0;

    q.opt.forEach((optStr,idx)=>{
        const div = document.createElement("div");
        div.className="option-item fade-in";
        div.innerText = optStr;
        div.onclick = ()=>selectOption(idx);
        document.getElementById("optionBox").appendChild(div);
    })
}

function selectOption(optIdx){
    answerRecord[currentQ] = optIdx;
    const add = scoreMap[currentQ][optIdx];
    for(let i=0;i<6;i++) score[i] += add[i];

    currentQ++;
    if(currentQ >= totalQ){
        showResult();
    }else{
        renderQuestion();
    }
}

function goPrev(){
    if(currentQ <= 0) return;
    currentQ--;
    const lastOpt = answerRecord[currentQ];
    const sub = scoreMap[currentQ][lastOpt];
    for(let i=0;i<6;i++) score[i] -= sub[i];
    renderQuestion();
}

function showResult(){
    document.getElementById("quizPage").style.display="none";
    document.getElementById("resultPage").style.display="block";
    let maxScore = Math.max(...score);
    let candidates = [];
    for(let i=0;i<6;i++){
        if(score[i] === maxScore) candidates.push(i);
    }
    const resIdx = candidates[Math.floor(Math.random()*candidates.length)];
    const res = resultList[resIdx];

    document.getElementById("resName").innerText = res.name;
    document.getElementById("resIntro").innerText = res.intro;
    document.getElementById("resAnalyse").innerText = res.analyse;
}

function restartTest(){
    currentQ = 0;
    score = [0,0,0,0,0,0];
    answerRecord = [];
    document.getElementById("resultPage").style.display="none";
    document.getElementById("startPage").style.display="flex";
}
</script>
